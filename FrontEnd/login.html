<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Pictures - Đăng nhập</title>
    
    <!-- Google Font: Montserrat -->    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Material Symbols (Icons) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="m3-surface-container">
        <!-- Header Real Pictures -->
        <div class="m3-header">
            <span class="material-symbols-outlined brand-icon">photo_camera_back</span>
            <h1 class="m3-headline">Real Pictures</h1>
            <p class="m3-subhead">Stock Photo Library</p>
        </div>

        <h2 class="m3-title-login">Khám phá kho tư liệu ảnh</h2>

        <!-- Form Đăng nhập -->
        <form class="m3-form" action="#" method="POST">
            <!-- Email Field -->
            <div class="m3-text-field">
                <span class="material-symbols-outlined field-icon">mail</span>
                <input type="email" id="txt-email" required placeholder=" ">
                <label for="txt-email">Email</label>
            </div>

            <!-- Password Field -->
            <div class="m3-text-field">
                <span class="material-symbols-outlined field-icon">lock</span>
                <input type="password" id="txt-password" required placeholder=" ">
                <label for="txt-password">Mật khẩu</label>
            </div>

            <!-- Action Button -->
            <button type="submit" class="m3-button-primary" id="btn-login">
                <span class="material-symbols-outlined">login</span>
                <span>Đăng nhập</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="m3-footer">
            <span>Chưa có tài khoản?</span>
            <a href="./signup.html" class="m3-link">Tạo tài khoản ngay</a>
        </div>
    </div>
    
    <!-- Firebase SDKs (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <script src="./firebase-config.js"></script>
    <script src="./login.js"></script>
</body>
</html>
