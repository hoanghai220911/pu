<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Pictures - Trang chủ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- Firebase SDKs (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="./firebase-config.js"></script>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="m3-dashboard-layout">
        <!-- Top App Bar -->
        <header class="m3-top-app-bar">
            <div class="brand-info">
                <span class="material-symbols-outlined brand-icon">photo_camera_back</span>
                <div>
                    <h1 class="m3-headline">Real Pictures</h1>
                    <p class="m3-subhead">Stock Photo Community</p>
                </div>
            </div>

            <div class="user-action-area">
                <div id="auth-actions" class="auth-buttons-group" style="display: none;">
                    <a href="./login.html" class="m3-button-secondary nav-btn">
                        <span class="material-symbols-outlined">login</span>
                        <span>Đăng nhập</span>
                    </a>
                    <a href="./signup.html" class="m3-button-primary nav-btn">
                        <span class="material-symbols-outlined">person_add</span>
                        <span>Đăng ký</span>
                    </a>
                </div>

                <div id="user-profile" class="user-profile-box" style="display: none;">
                    <span class="material-symbols-outlined account-icon">account_circle</span>
                    <span id="user-email-display" class="user-email">...</span>
                    <a href="./admin.html" id="admin-link" class="m3-button-secondary" style="display: none;">Admin</a>
                    <button id="btn-logout" class="m3-button-secondary">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="m3-main-content">
            <!-- Upload Box (Chỉ hiện khi đã đăng nhập) -->
            <div id="upload-container" class="m3-feature-card mb-24" style="display: none; margin-bottom: 30px;">
                <h3 style="margin-bottom: 12px;">Chia sẻ bức ảnh của bạn</h3>
                <form id="upload-form" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                    <input type="text" id="img-caption" class="m3-text-field" placeholder="Mô tả bức ảnh..." style="flex: 1; min-width: 200px; height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--md-sys-color-outline);" required>
                    <input type="file" id="img-file" accept="image/*" required style="color: #fff;">
                    <button type="submit" id="btn-upload" class="m3-button-primary" style="height: 44px; padding: 0 20px;">
                        <span class="material-symbols-outlined">upload</span>
                        <span>Đăng ảnh</span>
                    </button>
                </form>
            </div>

            <!-- Photo Feed Gallery -->
            <h2 class="welcome-title">Khám phá tư liệu ảnh</h2>
            <div id="photo-feed" class="m3-grid">
                <!-- Nội dung ảnh động từ Firestore -->
            </div>
        </main>
    </div>

    <script src="./index.js"></script>
</body>
</html>
